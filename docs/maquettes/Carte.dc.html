<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Les Délices d'Orodis — La carte</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#FBF5EE}
@keyframes orodis-sheet{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
@keyframes orodis-fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</helmet>
<div style="position: relative; width: 100%; container-type: inline-size; background: #FBF5EE; color: #241014; font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.5; overflow: hidden; --R: clamp(330px, 34cqi, 500px); --rw: clamp(128px, 12.5cqi, 180px); --sw: clamp(150px, 15cqi, 210px); --cw: clamp(190px, 21cqi, 290px)">

<!-- ============ EN-TÊTE APP (masqué quand la carte est intégrée à l'accueil) ============ -->
<sc-if value="{{standalone}}" hint-placeholder-val="{{ true }}">
<header style="position: sticky; top: 0; z-index: 30; background: rgba(251,245,238,0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #EADBD3">
<div style="max-width: 1200px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<img src="/_blob/9605bc1b83d0a09f9605df8729f3433b" alt="Les Délices d'Orodis" style="height: 46px; width: auto">
<div style="display: flex; align-items: center; gap: 10px">
<span style="background: #F4E3E1; color: #810C1B; font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 999px">Table 5</span>
<button type="button" aria-label="Voir le panier" style="position: relative; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: #241014; color: #FFFFFF; font: inherit; font-weight: 700; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 7H6.5"></path><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle></svg>
Panier
<span style="{{badgeStyle}}">{{cart}}</span>
</button>
</div>
</div>
</header>

<!-- ============ TITRE ============ -->
<section style="max-width: 1200px; margin: 0 auto; padding: 36px 20px 0; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center">
<span style="font-size: 13px; font-weight: 700; color: #810C1B; letter-spacing: 0.14em; text-transform: uppercase">Notre carte</span>
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: clamp(32px, 4cqi, 54px); line-height: 1.04; letter-spacing: -0.02em">Que désirez-vous <span style="font-style: italic; color: #810C1B">aujourd'hui&nbsp;?</span></h1>
</section>
</sc-if>

<!-- ============ ANNEAU — CATÉGORIES ============ -->
<section aria-label="Catégories : faites glisser pour tourner la roue" tabIndex="0" onKeyDown="{{ringZ.key}}" onPointerDown="{{ringZ.down}}" onPointerMove="{{ringZ.move}}" onPointerUp="{{ringZ.up}}" onPointerCancel="{{ringZ.up}}" style="position: relative; height: calc(var(--rw) * 1.25 + 0.42 * var(--R) + 10px); margin-top: 8px; touch-action: pan-y; user-select: none; cursor: grab; outline-offset: -4px">
<sc-for list="{{ring}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" aria-label="{{c.name}}" style="{{c.style}}">
<span style="width: 46px; height: 46px; border-radius: 14px; background: {{c.iconBg}}; display: flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{c.iconFg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>
</span>
<span style="font-family: 'Fraunces', serif; font-weight: 700; font-size: clamp(16px, 1.6cqi, 21px); line-height: 1.1; color: {{c.fg}}">{{c.name}}</span>
<span style="font-size: 13px; font-weight: 500; color: {{c.sub}}">{{c.count}}</span>
</button>
</sc-for>
</section>

<!-- ============ COUVERTUREFLOW — SOUS-CATÉGORIES ============ -->
<section aria-label="Sous-catégories" style="max-width: 1200px; margin: 36px auto 0; padding: 0 20px">
<div style="display: flex; align-items: baseline; justify-content: center; gap: 10px; margin-bottom: 14px">
<h2 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: clamp(24px, 2.6cqi, 34px); color: #810C1B">{{catName}}</h2>
</div>
<div tabIndex="0" aria-label="Sous-catégories : faites glisser pour parcourir" onKeyDown="{{subZ.key}}" onPointerDown="{{subZ.down}}" onPointerMove="{{subZ.move}}" onPointerUp="{{subZ.up}}" onPointerCancel="{{subZ.up}}" style="position: relative; height: calc(var(--sw) * 0.62 + 30px); perspective: 1100px; transform-style: preserve-3d; touch-action: pan-y; user-select: none; cursor: grab; outline-offset: -4px">
<sc-for list="{{subs}}" as="s" hint-placeholder-count="4">
<button type="button" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="{{s.style}}">
<span style="font-family: 'Fraunces', serif; font-weight: 700; font-size: clamp(17px, 1.7cqi, 22px); line-height: 1.1">{{s.name}}</span>
<span style="font-size: 13px; opacity: 0.8">{{s.count}}</span>
</button>
</sc-for>
</div>
</section>

<!-- ============ COUVERTUREFLOW — PLATS ============ -->
<section aria-label="Plats" style="max-width: 1200px; margin: 18px auto 0; padding: 0 20px">
<div tabIndex="0" aria-label="Plats : faites glisser pour parcourir" onKeyDown="{{itemZ.key}}" onPointerDown="{{itemZ.down}}" onPointerMove="{{itemZ.move}}" onPointerUp="{{itemZ.up}}" onPointerCancel="{{itemZ.up}}" style="position: relative; height: calc(var(--cw) * 1.4 + 30px); perspective: 1200px; transform-style: preserve-3d; touch-action: pan-y; user-select: none; cursor: grab; outline-offset: -4px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<button type="button" onClick="{{it.pick}}" aria-label="{{it.label}}" style="{{it.style}}">
<span style="display: block; position: relative; height: 64%; overflow: hidden; border-radius: 18px 18px 0 0">
<sc-if value="{{it.hasImg}}" hint-placeholder-val="{{ false }}">
<img src="{{it.img}}" alt="" draggable="false" style="width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none">
</sc-if>
<sc-if value="{{it.noImg}}" hint-placeholder-val="{{ true }}">
<span style="position: absolute; inset: 0; background: {{it.tint}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
<span style="font-family: 'Fraunces', serif; font-weight: 700; font-style: italic; font-size: clamp(48px, 6cqi, 84px); line-height: 1; color: {{it.mono}}">{{it.initial}}</span>
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: {{it.mono}}">Photo facultative</span>
</span>
</sc-if>
</span>
<span style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; text-align: left">
<span style="font-family: 'Fraunces', serif; font-weight: 700; font-size: clamp(17px, 1.7cqi, 21px); line-height: 1.15; color: #241014">{{it.name}}</span>
<span style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-weight: 700; color: #810C1B">[PRIX] F</span>
<span style="{{it.ctaStyle}}">{{it.cta}}</span>
</span>
</span>
</button>
</sc-for>
</div>
<div aria-hidden="true" style="display: flex; justify-content: center; gap: 6px; margin-top: 12px">
<sc-for list="{{dots}}" as="dt" hint-placeholder-count="4"><span style="{{dt}}"></span></sc-for>
</div>
<p style="margin: 14px 0 60px; text-align: center; font-size: 14px; color: #6B5458">Faites glisser du doigt pour parcourir. Touchez le plat du centre pour le voir en détail.</p>
</section>

<!-- ============ FICHE PLAT ============ -->
<sc-if value="{{detailOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 40; background: rgba(36,16,20,0.55); display: flex; justify-content: center; align-items: flex-start; padding: 120px 16px 16px; animation: orodis-fade 0.25s ease both">
<div role="dialog" aria-label="{{dName}}" style="width: 100%; max-width: 440px; background: #FFFFFF; border-radius: 28px; overflow: hidden; box-shadow: 0 30px 80px rgba(36,16,20,0.4); animation: orodis-sheet 0.45s cubic-bezier(0.16,1,0.3,1) both">
<div style="position: relative; height: 240px">
<sc-if value="{{dHasImg}}" hint-placeholder-val="{{ false }}"><img src="{{dImg}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></sc-if>
<sc-if value="{{dNoImg}}" hint-placeholder-val="{{ true }}"><div style="position: absolute; inset: 0; background: {{dTint}}; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-weight: 700; font-style: italic; font-size: 110px; color: {{dMono}}">{{dInitial}}</div></sc-if>
<button type="button" onClick="{{closeDetail}}" aria-label="Fermer" style="position: absolute; right: 14px; top: 14px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.92); color: #241014; font: inherit; font-size: 22px; font-weight: 700; cursor: pointer">×</button>
</div>
<div style="padding: 22px 24px 24px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #810C1B">{{dPath}}</span>
<h3 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 30px; line-height: 1.1">{{dName}}</h3>
<p style="margin: 0; color: #6B5458">[Description du plat : ingrédients, accompagnement, quantité.]</p>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px">
<span style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 24px">[PRIX] F</span>
<div style="display: flex; align-items: center; gap: 4px; background: #F5ECE4; border-radius: 999px; padding: 4px">
<button type="button" onClick="{{qtyMinus}}" aria-label="Retirer un" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: #FFFFFF; font: inherit; font-size: 20px; font-weight: 700; cursor: pointer">−</button>
<span style="min-width: 32px; text-align: center; font-weight: 700; font-size: 18px">{{qty}}</span>
<button type="button" onClick="{{qtyPlus}}" aria-label="Ajouter un" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: #FFFFFF; font: inherit; font-size: 20px; font-weight: 700; cursor: pointer">+</button>
</div>
</div>
<button type="button" onClick="{{addToCart}}" style="margin-top: 8px; height: 56px; border: 0; border-radius: 999px; background: #810C1B; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer">Ajouter au panier</button>
</div>
</div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"embedded":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 2, sub: 0, item: 1, detail: false, qty: 1, cart: 0, dragZone: null, dx: 0 };
  }
  data() {
    if (this._data) return this._data;
    var I = {
      sun: 'M12 4V2M12 22v-2M4.9 4.9 3.5 3.5M20.5 20.5l-1.4-1.4M4 12H2M22 12h-2M4.9 19.1l-1.4 1.4M20.5 3.5l-1.4 1.4M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z',
      leaf: 'M5 21c0-9 6-15 15-16-1 9-7 15-15 16zM5 21l8-8',
      pot: 'M4 10h16v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM2 10h20M8 6c0-1 1-1 1-2M12 6c0-1 1-1 1-2M16 6c0-1 1-1 1-2',
      plate: 'M12 19a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 4v6M2 7h1.5M22 4c-1.5 1-1.5 4 0 5v11',
      cake: 'M4 21h16M5 21v-7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v7M5 16c2 1 3 1 4.5 0s3-1 4.5 0 3 1 5 0M12 12V8M12 5.5v.5',
      glass: 'M7 3h10l-1 18H8zM7.5 9h9M15 3l2-1'
    };
    var C = [
      { name: 'Entrées', icon: I.leaf, tint: '#E9EFD9', mono: '#4D6B2E', subs: [['Froides', ['Salade niçoise', 'Avocat crevettes', 'Crudités maison']], ['Chaudes', ['Accras de poisson', 'Soupe du jour', 'Nems au poulet']]] },
      { name: 'Petit-déjeuner', icon: I.sun, tint: '#F6E7A8', mono: '#7A5C00', subs: [['Viennoiseries', ['Croissant', 'Pain au chocolat', 'Pain aux raisins']], ['Plats chauds', ['Omelette complète', 'Œufs brouillés', 'Bouillie de mil']], ['Boissons chaudes', ['Café', 'Thé citronnelle', 'Chocolat chaud']]] },
      { name: 'Plats africains', icon: I.pot, tint: '#F2D9C7', mono: '#8A3B12', subs: [['Grillades', ['Poulet braisé', 'Poisson braisé', 'Brochettes de bœuf', 'Choukouya']], ['Sauces', ['Kedjenou de poulet', 'Sauce graine', 'Sauce arachide', 'Sauce feuille']], ['Attiéké & garba', ['Garba spécial', 'Attiéké poisson', 'Attiéké poulet']], ['Accompagnements', ['Alloco', 'Foutou banane', 'Placali', 'Riz blanc']]] },
      { name: 'Plats européens', icon: I.plate, tint: '#EBD3D0', mono: '#810C1B', subs: [['Burgers', ['Burger maison', 'Double cheese', 'Burger poulet']], ['Pizzas', ['Margherita', 'Reine', 'Pizza Orodis', '4 fromages']], ['Pâtes', ['Bolognaise', 'Carbonara', 'Pâtes au poulet']], ['Viandes', ['Émincé de bœuf', 'Escalope de poulet', 'Côte de bœuf']]] },
      { name: 'Pâtisserie & desserts', icon: I.cake, tint: '#F4E3E1', mono: '#9C2A4A', subs: [['Gâteaux', ['Forêt-noire', 'Fraisier', 'Gâteau coco']], ['Petites douceurs', ['Éclair', 'Tartelette', 'Mille-feuille']], ['Sur commande', ['Gâteau d’anniversaire', 'Pièce montée']]] },
      { name: 'Boissons', icon: I.glass, tint: '#DDEBF0', mono: '#245B6E', subs: [['Jus maison', ['Bissap', 'Gingembre', 'Bouye (baobab)', 'Passion']], ['Sodas & eaux', ['Coca-Cola', 'Fanta', 'Eau minérale']], ['Cocktails sans alcool', ['Cocktail de fruits', 'Mojito virgin']]] }
    ];
    // img: '' = pas de photo (visuel de remplacement). Mettre l'URL d'une photo pour l'afficher.
    C.forEach(function (c) { c.subs = c.subs.map(function (s) { return { name: s[0], items: s[1].map(function (n) { return { name: n, img: '' }; }) }; }); });
    this._data = C;
    return C;
  }
  renderVals() {
    var self = this, st = this.state, C = this.data();
    var cat = C[st.cat], sub = cat.subs[Math.min(st.sub, cat.subs.length - 1)];
    var items = sub.items, iAct = Math.min(st.item, items.length - 1);
    var ease = 'cubic-bezier(0.22,1,0.36,1)';
    var dz = st.dragZone, dx = st.dx || 0;

    // ---- Glisser au doigt (pointer events : tactile + souris)
    function clampF(v, n) { return v < -0.35 ? -0.35 : (v > n - 0.65 ? n - 0.65 : v); }
    function zone(name, unit, active, count, go) {
      return {
        down: function (e) { self._zone = name; self._sx = e.clientX; self._moved = false; self._cap = false; },
        move: function (e) {
          if (self._zone !== name) return;
          var d = e.clientX - self._sx;
          if (!self._moved && Math.abs(d) > 8) {
            self._moved = true;
            if (!self._cap) { try { e.currentTarget.setPointerCapture(e.pointerId); self._cap = true; } catch (err) {} }
          }
          if (self._moved) self.setState({ dragZone: name, dx: d });
        },
        up: function () {
          if (self._zone !== name) return;
          self._zone = null;
          if (!self._moved) return;
          var d = self.state.dx || 0, steps = Math.round(-d / unit);
          if (steps === 0 && Math.abs(d) > 30) steps = d < 0 ? 1 : -1;
          var next = Math.max(0, Math.min(count - 1, active + steps));
          var patch = go(next); patch.dragZone = null; patch.dx = 0;
          self.setState(patch);
          setTimeout(function () { self._moved = false; }, 0);
        },
        key: function (e) {
          if (e.key === 'ArrowRight' && active < count - 1) self.setState(go(active + 1));
          if (e.key === 'ArrowLeft' && active > 0) self.setState(go(active - 1));
        }
      };
    }
    var goCat = function (n) { return { cat: n, sub: 0, item: Math.min(1, C[n].subs[0].items.length - 1), detail: false }; };
    var goSub = function (n) { return { sub: n, item: Math.min(1, cat.subs[n].items.length - 1), detail: false }; };
    var goItem = function (n) { return { item: n }; };
    var ringZ = zone('ring', 120, st.cat, C.length, goCat);
    var subZ = zone('sub', 110, st.sub, cat.subs.length, goSub);
    var itemZ = zone('item', 140, iAct, items.length, goItem);
    var fCat = dz === 'ring' ? clampF(st.cat - dx / 120, C.length) : st.cat;
    var fSub = dz === 'sub' ? clampF(st.sub - dx / 110, cat.subs.length) : st.sub;
    var fItem = dz === 'item' ? clampF(iAct - dx / 140, items.length) : iAct;

    // ---- Anneau
    var ring = C.map(function (c, i) {
      var d = i - fCat, on = Math.round(d) === 0, n = 0;
      c.subs.forEach(function (s) { n += s.items.length; });
      return {
        name: c.name, count: n + ' plats', icon: c.icon, pressed: on ? 'true' : 'false',
        iconBg: on ? 'rgba(255,255,255,0.16)' : c.tint, iconFg: on ? '#EBE320' : c.mono,
        fg: on ? '#FFFFFF' : '#241014', sub: on ? '#F2D9D6' : '#6B5458',
        style: 'position: absolute; left: 50%; top: calc(var(--R) + var(--rw) * 0.62 + 10px); width: var(--rw); height: calc(var(--rw) * 1.25); margin: calc(var(--rw) * -0.625) 0 0 calc(var(--rw) * -0.5); transform: rotate(' + (d * 26).toFixed(2) + 'deg) translateY(calc(var(--R) * -1)) scale(' + (on ? 1.08 : 0.92) + '); transition: ' + (dz === 'ring' ? 'background 0.3s' : 'transform 0.75s ' + ease + ', background 0.4s, box-shadow 0.4s') + '; z-index: ' + (10 - Math.round(Math.abs(d))) + '; border-radius: 22px; border: ' + (on ? '0' : '1px solid #EADBD3') + '; background: ' + (on ? '#810C1B' : '#FFFFFF') + '; box-shadow: ' + (on ? '0 22px 46px rgba(129,12,27,0.35)' : '0 8px 22px rgba(60,10,20,0.08)') + '; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 14px; text-align: center; font: inherit; cursor: pointer; opacity: ' + (Math.abs(d) > 3 ? 0 : 1) + ';',
        pick: function () { if (self._moved) return; self.setState(goCat(i)); }
      };
    });

    // ---- CouvertureFlow (formule commune, continue pour suivre le doigt)
    function flow(d, wVar, dragging) {
      var a = Math.abs(d), s = d < 0 ? -1 : 1, m = Math.min(a, 1);
      var k = a <= 1 ? s * 0.62 * a : s * (0.62 + (a - 1) * 0.3);
      return 'position: absolute; left: 50%; top: 10px; transform: translateX(-50%) translateX(calc(var(' + wVar + ') * ' + k.toFixed(3) + ')) translateZ(' + (-140 * m).toFixed(1) + 'px) rotateY(' + (-s * 52 * m).toFixed(2) + 'deg); transition: ' + (dragging ? 'box-shadow 0.3s' : 'transform 0.65s ' + ease + ', opacity 0.4s, box-shadow 0.4s') + '; z-index: ' + (50 - Math.round(a)) + '; opacity: ' + (a > 5 ? 0 : 1) + ';';
    }
    var subs = cat.subs.map(function (s, i) {
      var d = i - fSub, on = Math.round(d) === 0;
      return {
        name: s.name, count: s.items.length + ' plats', pressed: on ? 'true' : 'false',
        style: flow(d, '--sw', dz === 'sub') + ' width: var(--sw); height: calc(var(--sw) * 0.62); border-radius: 18px; border: ' + (on ? '0' : '1px solid #EADBD3') + '; background: ' + (on ? '#241014' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#241014') + '; box-shadow: ' + (on ? '0 16px 36px rgba(36,16,20,0.3)' : '0 6px 16px rgba(60,10,20,0.06)') + '; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px; font: inherit; cursor: pointer;',
        pick: function () { if (self._moved) return; self.setState(goSub(i)); }
      };
    });
    var list = items.map(function (it, i) {
      var d = i - fItem, on = Math.round(d) === 0;
      return {
        name: it.name, label: it.name + (on ? ', voir le détail' : ''),
        img: it.img, hasImg: !!it.img, noImg: !it.img, initial: it.name.charAt(0), tint: cat.tint, mono: cat.mono,
        cta: on ? 'Voir' : '', ctaStyle: on ? 'background: #810C1B; color: #FFFFFF; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px' : 'display: none',
        style: flow(d, '--cw', dz === 'item') + ' width: var(--cw); height: calc(var(--cw) * 1.4); border-radius: 20px; border: 0; padding: 0; background: #FFFFFF; box-shadow: ' + (on ? '0 26px 60px rgba(60,10,20,0.28)' : '0 10px 26px rgba(60,10,20,0.10)') + '; overflow: hidden; display: flex; flex-direction: column; font: inherit; cursor: pointer;',
        pick: function () { if (self._moved) return; if (i === iAct) self.setState({ detail: true, qty: 1 }); else self.setState({ item: i }); }
      };
    });
    var cur = items[iAct];
    var badgeOn = st.cart > 0;
    return {
      standalone: !(this.props.embedded ?? false),
      ring: ring, subs: subs, items: list, catName: cat.name, cart: st.cart,
      badgeStyle: badgeOn ? 'position: absolute; right: -6px; top: -6px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; background: #EBE320; color: #241014; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center' : 'display: none',
      ringZ: ringZ, subZ: subZ, itemZ: itemZ,
      dots: items.map(function (x, i) { return i === iAct ? 'width: 22px; height: 8px; border-radius: 4px; background: #810C1B; transition: width 0.3s' : 'width: 8px; height: 8px; border-radius: 4px; background: #E2CFC6; transition: width 0.3s'; }),
      detailOpen: st.detail, dName: cur.name, dPath: cat.name + ' · ' + sub.name, dImg: cur.img, dHasImg: !!cur.img, dNoImg: !cur.img,
      dInitial: cur.name.charAt(0), dTint: cat.tint, dMono: cat.mono, qty: st.qty,
      qtyMinus: function () { self.setState({ qty: Math.max(1, st.qty - 1) }); },
      qtyPlus: function () { self.setState({ qty: st.qty + 1 }); },
      closeDetail: function () { self.setState({ detail: false }); },
      addToCart: function () { self.setState({ cart: st.cart + st.qty, detail: false }); }
    };
  }
}
</script>
</body>
</html>
