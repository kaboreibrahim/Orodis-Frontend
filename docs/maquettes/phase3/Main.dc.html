<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil après le scan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#FBF5EE}
@keyframes ping{0%{transform:scale(1);opacity:.6}80%,100%{transform:scale(2.6);opacity:0}}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FBF5EE; color: #241014; font-family: 'DM Sans', system-ui, sans-serif">

<div style="padding: 22px 20px 0; display: flex; justify-content: space-between; align-items: flex-start">
<img src="/_blob/7ab1a07f2344daf048d5aa18a3980797" alt="Les Délices d'Orodis, restaurant" style="height: 88px; width: auto">
<span style="margin-top: 14px; display: inline-flex; align-items: center; gap: 8px; background: #810C1B; color: #FFFFFF; font-weight: 700; font-size: 15px; padding: 10px 16px; border-radius: 999px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EBE320" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18M5 9v10M19 9v10M8 9V6M16 9V6M8 14h8"></path></svg>
Table 5</span>
</div>

<div style="padding: 10px 24px 0; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-style: italic; font-size: 52px; line-height: 1; letter-spacing: -0.02em; color: #810C1B; position: relative; align-self: flex-start">Bienvenue&nbsp;!<svg viewBox="0 0 300 20" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; bottom: -10px; width: 92%; height: 12px"><path d="M4 14 C90 4 200 3 296 9" fill="none" stroke="#EBE320" stroke-width="7" stroke-linecap="round"></path></svg></h1>
<p style="margin: 6px 0 0; font-size: 17px; line-height: 1.4; color: #3E2A2E">Spécialités africaines et européennes, pâtisserie maison.</p>
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; background: #FFFFFF; border: 1px solid #DCEBD8; padding: 8px 14px 8px 12px; border-radius: 999px; font-size: 14px; font-weight: 700">
<span style="position: relative; width: 10px; height: 10px; display: inline-block"><span style="position: absolute; inset: 0; border-radius: 50%; background: #1F9D55; animation: ping 1.8s ease-out infinite"></span><span style="position: absolute; inset: 0; border-radius: 50%; background: #1F9D55"></span></span>
Ouvert 24h/24 · 7j/7</span>
</div>

<div style="position: relative; margin: 18px 0 0; height: 250px">
<img src="/_blob/c8e0ab23c02cdf5820ba18017d960463" alt="Assiette de poulet braisé, riz et alloco" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<svg viewBox="0 0 390 60" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; bottom: -1px; width: 100%; height: 46px"><path d="M0 40 C120 0 260 70 390 20 L390 60 L0 60 Z" fill="#FBF5EE"></path></svg>
<span style="position: absolute; right: 12px; top: 12px; background: rgba(36,16,20,0.6); color: #FFFFFF; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px">Photo d'illustration</span>
</div>

<div style="padding: 6px 20px 0; display: flex; flex-direction: column; gap: 12px">
<a href="Carte.dc.html" style="height: 64px; border-radius: 999px; background: #810C1B; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; box-shadow: 0 14px 30px rgba(129,12,27,0.3)">
<span style="display: flex; align-items: center; gap: 14px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11a3 3 0 0 1 3 3v15H8a3 3 0 0 1-3-3z"></path><path d="M9 8h6M9 12h6M9 16h4"></path></svg>
<span style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 24px">Voir la carte</span></span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" onClick="{{callWaiter}}" style="min-height: 64px; border-radius: 22px; border: 1.5px solid #810C1B; background: #FFFFFF; color: #241014; font: inherit; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px; padding: 0 14px; text-align: left; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#810C1B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg>
Appeler un serveur</button>
<button type="button" onClick="{{askBill}}" style="min-height: 64px; border-radius: 22px; border: 1.5px solid #810C1B; background: #FFFFFF; color: #241014; font: inherit; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px; padding: 0 14px; text-align: left; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#810C1B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
Demander l'addition</button>
</div>
</div>

<svg viewBox="0 0 390 70" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 100%; height: 60px"><path d="M0 30 C110 70 250 0 390 40 L390 70 L0 70 Z" fill="#810C1B"></path><path d="M0 30 C110 70 250 0 390 40" fill="none" stroke="#EBE320" stroke-width="4"></path></svg>

<sc-if value="{{toastOn}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); width: 330px; background: #241014; color: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; animation: toast 0.35s cubic-bezier(0.16,1,0.3,1) both; box-shadow: 0 16px 40px rgba(36,16,20,0.35)">
<span style="width: 34px; height: 34px; border-radius: 50%; background: #1F9D55; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L19 7"></path></svg></span>
<span style="font-size: 14px; line-height: 1.35">{{toastText}}</span>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { toast: '' }; }
  show(t) {
    var self = this;
    this.setState({ toast: t });
    clearTimeout(this._t);
    this._t = setTimeout(function () { self.setState({ toast: '' }); }, 2600);
  }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    var self = this;
    return {
      toastOn: !!this.state.toast, toastText: this.state.toast,
      callWaiter: function () { self.show('Un serveur a été prévenu. Il arrive à la table 5.'); },
      askBill: function () { self.show('Votre demande d’addition a été envoyée au serveur.'); }
    };
  }
}
</script>
</body>
</html>
