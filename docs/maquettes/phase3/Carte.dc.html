<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>La carte</title>
<script src="./support.js"></script>
</head>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{margin:0;background:#FBF5EE}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FBF5EE; color: #241014; font-family: 'DM Sans', system-ui, sans-serif">

<!-- en-tête -->
<div style="padding: 12px 16px 0; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 6px">
<a href="Main.dc.html" aria-label="Retour à l'accueil" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #241014; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#241014" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<img src="/_blob/7ab1a07f2344daf048d5aa18a3980797" alt="Les Délices d'Orodis" style="height: 52px; width: auto">
</div>
<span style="display: inline-flex; align-items: center; gap: 6px; background: #810C1B; color: #FFFFFF; font-weight: 700; font-size: 14px; padding: 9px 14px; border-radius: 999px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#EBE320" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18M5 9v10M19 9v10M8 9V6M16 9V6M8 14h8"></path></svg>
Table 5</span>
</div>

<h1 style="margin: 6px 22px 0; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: -0.02em">Que désirez-vous<br><span style="font-style: italic; color: #810C1B">aujourd'hui&nbsp;?</span></h1>

<!-- anneau des catégories -->
<section aria-label="Catégories : faites glisser pour tourner la roue" tabIndex="0" onKeyDown="{{ringZ.key}}" onPointerDown="{{ringZ.down}}" onPointerMove="{{ringZ.move}}" onPointerUp="{{ringZ.up}}" onPointerCancel="{{ringZ.up}}" style="position: relative; height: 150px; margin-top: 6px; touch-action: pan-y; user-select: none; cursor: grab">
<sc-for list="{{ring}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" aria-label="{{c.name}}" style="{{c.style}}">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{c.iconFg}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>
<span style="font-size: 12.5px; font-weight: 700; line-height: 1.15; color: {{c.fg}}; white-space: pre-line">{{c.label}}</span>
</button>
</sc-for>
</section>

<!-- sous-catégories -->
<div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 2px">
<span style="width: 40px; height: 1px; background: #C9A9A4"></span>
<span style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 18px; color: #810C1B">{{catName}}</span>
<span style="width: 40px; height: 1px; background: #C9A9A4"></span>
</div>
<div tabIndex="0" aria-label="Sous-catégories : faites glisser pour parcourir" onKeyDown="{{subZ.key}}" onPointerDown="{{subZ.down}}" onPointerMove="{{subZ.move}}" onPointerUp="{{subZ.up}}" onPointerCancel="{{subZ.up}}" style="position: relative; height: 128px; margin-top: 6px; perspective: 900px; transform-style: preserve-3d; touch-action: pan-y; user-select: none; cursor: grab">
<sc-for list="{{subs}}" as="s" hint-placeholder-count="4">
<button type="button" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" aria-label="{{s.name}}" style="{{s.style}}">
<sc-if value="{{s.hasImg}}" hint-placeholder-val="{{ true }}"><img src="{{s.img}}" alt="" draggable="false" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none"></sc-if>
<sc-if value="{{s.noImg}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; inset: 0; background: {{s.tint}}; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-style: italic; font-weight: 700; font-size: 44px; color: {{s.mono}}">{{s.initial}}</span></sc-if>
<span style="position: absolute; left: 0; right: 0; bottom: 0; background: #810C1B; color: #FFFFFF; font-size: 13px; font-weight: 700; padding: 8px 6px; text-align: center">{{s.name}}</span>
</button>
</sc-for>
</div>

<!-- plats -->
<div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 10px">
<span style="width: 40px; height: 1px; background: #C9A9A4"></span>
<span style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 18px; color: #241014">{{subName}}</span>
<span style="width: 40px; height: 1px; background: #C9A9A4"></span>
</div>
<div tabIndex="0" aria-label="Plats : faites glisser pour parcourir" onKeyDown="{{itemZ.key}}" onPointerDown="{{itemZ.down}}" onPointerMove="{{itemZ.move}}" onPointerUp="{{itemZ.up}}" onPointerCancel="{{itemZ.up}}" style="position: relative; height: 236px; margin-top: 6px; perspective: 1000px; transform-style: preserve-3d; touch-action: pan-y; user-select: none; cursor: grab">
<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<div style="{{it.style}}">
<button type="button" onClick="{{it.pick}}" aria-label="{{it.name}}" style="display: block; width: 100%; height: 128px; padding: 0; border: 0; background: transparent; cursor: pointer; position: relative">
<sc-if value="{{it.hasImg}}" hint-placeholder-val="{{ true }}"><img src="{{it.img}}" alt="" draggable="false" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none"></sc-if>
<sc-if value="{{it.noImg}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; inset: 0; background: {{it.tint}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><span style="font-family: 'Fraunces', serif; font-style: italic; font-weight: 700; font-size: 50px; line-height: 1; color: {{it.mono}}">{{it.initial}}</span><span style="font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: {{it.mono}}">Photo à venir</span></span></sc-if>
</button>
<div style="padding: 10px 10px 12px; text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center">
<span style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 16px; line-height: 1.15">{{it.name}}</span>
<span style="font-weight: 700; font-size: 15px; color: #810C1B">{{it.price}}</span>
<sc-if value="{{it.on}}" hint-placeholder-val="{{ false }}"><a href="Fiche.dc.html" style="margin-top: 4px; background: #810C1B; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 14px; padding: 8px 26px; border-radius: 999px">Voir</a></sc-if>
</div>
</div>
</sc-for>
</div>
<div aria-hidden="true" style="display: flex; justify-content: center; gap: 6px; margin-top: 4px">
<sc-for list="{{dots}}" as="dt" hint-placeholder-count="4"><span style="{{dt}}"></span></sc-for>
</div>
<p style="margin: 6px 0 0; text-align: center; font-size: 13px; color: #6B5458">Faites glisser du doigt pour parcourir</p>

<!-- barre panier -->
<a href="Panier.dc.html" style="position: absolute; left: 16px; right: 16px; bottom: 16px; height: 60px; border-radius: 999px; background: #810C1B; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: 0 14px 30px rgba(129,12,27,0.35)">
<span style="display: flex; align-items: center; gap: 12px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EBE320" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 7H6.5"></path><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle></svg>
<span style="font-weight: 700; font-size: 16px">Voir mon panier · 2</span></span>
<span style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px">8 000 F<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
</a>

</div>
</x-dc>
