<script type="text/x-dc" data-dc-script data-props='{"num":{"editor":"int","default":5,"min":1,"max":99},"$preview":{"width":559,"height":794}}'>
class Component extends DCLogic {
  renderVals() {
    var num = this.props.num ?? 5, n = 21, qr = [], seed = num * 7 + 13;
    var finder = function (x, y, ox, oy) { var dx = x - ox, dy = y - oy; if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return null; if (dx === 0 || dy === 0 || dx === 6 || dy === 6) return true; return dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4; };
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
      var f = finder(x, y, 0, 0); if (f === null) f = finder(x, y, 14, 0); if (f === null) f = finder(x, y, 0, 14);
      var on;
      if (f !== null) on = f; else if (x === 7 || y === 7 || (x === 13 && y < 8) || (y === 13 && x < 8)) on = false; else on = ((x * 31 + y * 17 + x * y * seed) % 5) < 2;
      qr.push(on ? '#241014' : '#FFFFFF');
    }
    return { qr: qr, num: num };
  }
}
</script>
