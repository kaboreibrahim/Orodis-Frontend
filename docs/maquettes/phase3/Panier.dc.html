<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Panier et paiement</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#FBF5EE}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FBF5EE; color: #241014; font-family: 'DM Sans', system-ui, sans-serif">

<div style="padding: 12px 16px 0; display: flex; align-items: center; justify-content: space-between">
<a href="Carte.dc.html" aria-label="Retour à la carte" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#241014" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span style="display: inline-flex; align-items: center; gap: 6px; background: #810C1B; color: #FFFFFF; font-weight: 700; font-size: 14px; padding: 9px 14px; border-radius: 999px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#EBE320" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18M5 9v10M19 9v10M8 9V6M16 9V6M8 14h8"></path></svg>
Table 5</span>
</div>

<div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 12px">
<div>
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 32px; line-height: 1.05">Ma commande</h1>
<div style="font-size: 14px; color: #6B5458; margin-top: 2px">Table 5 · sur place</div>
</div>

<sc-for list="{{lines}}" as="l" hint-placeholder-count="2">
<div style="background: #FFFFFF; border-radius: 18px; padding: 10px; display: flex; gap: 12px; align-items: center; box-shadow: 0 6px 16px rgba(60,10,20,0.06)">
<img src="{{l.img}}" alt="" style="width: 66px; height: 66px; border-radius: 14px; object-fit: cover; flex-shrink: 0">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 16px; line-height: 1.15">{{l.name}}</span>
<span style="font-size: 12.5px; color: #6B5458">{{l.opts}}</span>
<span style="font-weight: 700; font-size: 15px; color: #810C1B">{{l.price}}</span>
</div>
<div style="display: flex; align-items: center; gap: 2px; background: #F5ECE4; border-radius: 999px; padding: 2px">
<button type="button" onClick="{{l.minus}}" aria-label="Retirer un" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #FFFFFF; font: inherit; font-size: 18px; font-weight: 700; color: #241014; cursor: pointer">−</button>
<span style="min-width: 18px; text-align: center; font-weight: 700">{{l.qty}}</span>
<button type="button" onClick="{{l.plus}}" aria-label="Ajouter un" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #810C1B; font: inherit; font-size: 18px; font-weight: 700; color: #FFFFFF; cursor: pointer">+</button>
</div>
</div>
</sc-for>

<div style="background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 15px">
<div style="display: flex; justify-content: space-between"><span style="color: #6B5458">Sous-total</span><span>{{subtotal}}</span></div>
<div style="display: flex; justify-content: space-between"><span style="color: #6B5458">Service à table</span><span>Inclus</span></div>
<div style="height: 1px; background: #EADBD3; margin: 4px 0"></div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px">Total</span><span style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 26px; color: #810C1B">{{subtotal}}</span></div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-weight: 700; font-size: 15px">Quand voulez-vous payer&nbsp;?</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: #F4E3E1; padding: 4px; border-radius: 999px">
<button type="button" onClick="{{payNow}}" aria-pressed="{{nowPressed}}" style="{{nowStyle}}">Maintenant</button>
<button type="button" onClick="{{payLater}}" aria-pressed="{{laterPressed}}" style="{{laterStyle}}">À la fin du repas</button>
</div>
</div>

<sc-if value="{{showMethods}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{methods}}" as="m" hint-placeholder-count="4">
<button type="button" onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" style="{{m.style}}"><span style="width: 22px; height: 22px; border-radius: 50%; background: {{m.color}}; flex-shrink: 0"></span>{{m.name}}</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{showLater}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 14px; color: #6B5458; background: #FFFFFF; border-radius: 14px; padding: 12px 14px">Vous réglerez l'addition à la fin du repas, auprès du serveur ou depuis cet écran.</p>
</sc-if>
</div>

<a href="Suivi.dc.html" style="position: absolute; left: 16px; right: 16px; bottom: 16px; height: 60px; border-radius: 999px; background: #810C1B; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; font-size: 17px; box-shadow: 0 14px 30px rgba(129,12,27,0.35)">{{cta}}</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: [1, 1], now: true, method: 0 }; }
  renderVals() {
    var self = this, st = this.state;
    var fmt = function (n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' F'; };
    var defs = [['Kedjenou de poulet', 'Attiéké · piment doux', 4500, '/_blob/d5a89a5c7b1264603c87511657080e47'], ['Garba spécial', 'Thon frit · piment fort', 3500, '/_blob/b05b4627d5dfda14d8f4fbe192971681']];
    var total = 0;
    var lines = defs.map(function (d, i) {
      var q = st.q[i]; total += d[2] * q;
      var set = function (v) { var nq = st.q.slice(); nq[i] = Math.max(1, v); self.setState({ q: nq }); };
      return { name: d[0], opts: d[1], price: fmt(d[2] * q), img: d[3], qty: q, minus: function () { set(q - 1); }, plus: function () { set(q + 1); } };
    });
    var seg = 'min-height: 44px; border-radius: 999px; border: 0; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; ';
    var mdefs = [['Wave', '#1DC8F2'], ['Orange Money', '#FF7900'], ['MTN MoMo', '#FFCB05'], ['Espèces', '#2E7D32']];
    var methods = mdefs.map(function (m, i) {
      var on = st.method === i;
      return { name: m[0], color: m[1], pressed: on ? 'true' : 'false', style: 'min-height: 52px; border-radius: 16px; font: inherit; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 0 14px; cursor: pointer; color: #241014; ' + (on ? 'background: #FFF7D6; border: 2px solid #810C1B;' : 'background: #FFFFFF; border: 1.5px solid #E2CFC6;'), pick: function () { self.setState({ method: i }); } };
    });
    return {
      lines: lines, subtotal: fmt(total), methods: methods,
      showMethods: st.now, showLater: !st.now,
      nowPressed: st.now ? 'true' : 'false', laterPressed: st.now ? 'false' : 'true',
      nowStyle: seg + (st.now ? 'background: #810C1B; color: #FFFFFF;' : 'background: transparent; color: #810C1B;'),
      laterStyle: seg + (!st.now ? 'background: #810C1B; color: #FFFFFF;' : 'background: transparent; color: #810C1B;'),
      payNow: function () { self.setState({ now: true }); },
      payLater: function () { self.setState({ now: false }); },
      cta: st.now ? 'Payer ' + fmt(total) + ' et envoyer en cuisine' : 'Envoyer en cuisine · ' + fmt(total)
    };
  }
}
</script>
</body>
</html>
