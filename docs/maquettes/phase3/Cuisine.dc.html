<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Écran cuisine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#1A1210}
@keyframes newglow{0%,100%{box-shadow:0 0 0 0 rgba(235,227,32,0.0),0 10px 24px rgba(0,0,0,.35)}50%{box-shadow:0 0 0 6px rgba(235,227,32,0.55),0 10px 24px rgba(0,0,0,.35)}}
@keyframes drop{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="width: 1194px; height: 834px; box-sizing: border-box; background: #1A1210; color: #FFFFFF; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="height: 76px; flex-shrink: 0; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #3A2A26">
<div style="display: flex; align-items: center; gap: 16px">
<img src="/_blob/027155e9550be3e1a5582afafb7115d0" alt="Les Délices d'Orodis" style="height: 50px; width: auto">
<div style="width: 1px; height: 36px; background: #3A2A26"></div>
<div>
<div style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px">Cuisine · commandes en cours</div>
<div style="font-size: 13px; color: #CFC3BC">Toutes les commandes : tables, à emporter et livraisons</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<button type="button" onClick="{{addOrder}}" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #6E4A51; background: transparent; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer">+ Simuler une commande</button>
<div style="display: flex; align-items: center; gap: 8px; background: #2C221E; padding: 8px 14px; border-radius: 999px; font-weight: 700"><span style="width: 9px; height: 9px; border-radius: 50%; background: #3DDC84"></span>Service ouvert</div>
<div style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 26px">13:46</div>
</div>
</header>

<div style="flex: 1; min-height: 0; padding: 18px 20px 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{cols}}" as="col" hint-placeholder-count="3">
<section aria-label="{{col.name}}" style="background: #2A201C; border-radius: 20px; display: flex; flex-direction: column; min-height: 0">
<div style="padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid {{col.color}}">
<span style="font-weight: 700; font-size: 18px">{{col.name}}</span>
<span style="min-width: 32px; height: 28px; padding: 0 10px; border-radius: 999px; background: #3D302A; display: flex; align-items: center; justify-content: center; font-weight: 700">{{col.count}}</span>
</div>
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{col.tickets}}" as="t" hint-placeholder-count="2">
<article style="{{t.style}}">
<div style="height: 6px; background: {{col.color}}"></div>
<div style="padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 24px">{{t.label}}</span>
<span style="font-size: 12px; font-weight: 700; color: #FFFFFF; background: {{t.chColor}}; padding: 4px 10px; border-radius: 999px">{{t.channel}}</span>
</div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #6B5458"><span>{{t.sub}}</span><span style="{{t.timeStyle}}">{{t.time}}</span></div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{t.items}}" as="i" hint-placeholder-count="2">
<li style="font-size: 15px; line-height: 1.35"><strong>{{i.q}}× {{i.n}}</strong><br><span style="font-size: 13px; color: #6B5458">{{i.o}}</span></li>
</sc-for>
</ul>
<sc-if value="{{t.hasNote}}" hint-placeholder-val="{{ false }}"><div style="font-size: 13px; background: #FFF7D6; color: #5C4A00; border-radius: 10px; padding: 8px 10px"><strong>Note :</strong> {{t.note}}</div></sc-if>
<button type="button" onClick="{{t.next}}" style="{{t.btnStyle}}">{{t.btn}}</button>
</div>
</article>
</sc-for>
<sc-if value="{{col.empty}}" hint-placeholder-val="{{ false }}"><p style="margin: 20px 0; text-align: center; color: #8E7176; font-size: 14px">Aucune commande</p></sc-if>
</div>
</section>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      seq: 0,
      orders: [
        { id: 't5', label: 'Table 5', ch: 0, sub: 'Sur place · n° 208', min: 2, st: 0, isNew: true, items: [['1', 'Kedjenou de poulet', 'Attiéké · piment doux'], ['1', 'Garba spécial', 'Piment fort']], note: '' },
        { id: 'w51', label: 'N° 2051', ch: 1, sub: 'Retrait prévu 14h10', min: 5, st: 0, items: [['2', 'Poulet braisé', 'Alloco'], ['2', 'Jus de bissap', '']], note: '' },
        { id: 'd48', label: 'N° 2048', ch: 2, sub: 'Livraison · Cocody, Angré', min: 9, st: 1, items: [['1', 'Pizza Orodis', ''], ['1', 'Bissap frais', '']], note: 'Sonner à la grille bleue' },
        { id: 't2', label: 'Table 2', ch: 0, sub: 'Sur place · n° 205', min: 12, st: 1, items: [['2', 'Sauce graine', 'Riz'], ['1', 'Alloco', '']], note: '' },
        { id: 't9', label: 'Table 9', ch: 0, sub: 'Sur place · n° 203', min: 18, st: 2, items: [['1', 'Burger maison', 'Bien cuit'], ['2', 'Éclair', '']], note: '' }
      ]
    };
  }
  renderVals() {
    var self = this, st = this.state;
    var colDefs = [['Nouvelles', '#EBE320', 'Commencer'], ['En préparation', '#E0782E', 'Marquer prête'], ['Prêtes', '#3DDC84', 'Servie / remise']];
    var chDefs = [['Sur place', '#5E504A'], ['À emporter', '#245B6E'], ['Livraison', '#810C1B']];
    var advance = function (id) {
      var next = st.orders.map(function (o) { return o.id === id ? Object.assign({}, o, { st: o.st + 1, isNew: false }) : o; }).filter(function (o) { return o.st < 3; });
      self.setState({ orders: next });
    };
    var cols = colDefs.map(function (c, ci) {
      var tickets = st.orders.filter(function (o) { return o.st === ci; }).map(function (o) {
        var late = o.min >= 15;
        return {
          label: o.label, channel: chDefs[o.ch][0], chColor: chDefs[o.ch][1], sub: o.sub, time: 'il y a ' + o.min + ' min',
          timeStyle: late ? 'color: #B3261E; font-weight: 700' : 'color: #6B5458',
          items: o.items.map(function (i) { return { q: i[0], n: i[1], o: i[2] }; }), note: o.note, hasNote: !!o.note,
          style: 'background: #FFFFFF; color: #241014; border-radius: 16px; overflow: hidden; flex-shrink: 0; ' + (o.isNew ? 'animation: drop 0.5s cubic-bezier(0.16,1,0.3,1) both, newglow 1.6s ease-in-out 0.5s infinite;' : 'box-shadow: 0 10px 24px rgba(0,0,0,.35);'),
          btn: c[2], btnStyle: 'height: 48px; border: 0; border-radius: 12px; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; ' + (ci === 0 ? 'background: #241014; color: #FFFFFF;' : ci === 1 ? 'background: #810C1B; color: #FFFFFF;' : 'background: #1F7A45; color: #FFFFFF;'),
          next: function () { advance(o.id); }
        };
      });
      return { name: c[0], color: c[1], count: tickets.length, tickets: tickets, empty: tickets.length === 0 };
    });
    var extra = [
      { label: 'Table 7', ch: 0, sub: 'Sur place · n° 210', items: [['1', 'Brochettes de bœuf', 'Alloco'], ['1', 'Jus de gingembre', '']], note: '' },
      { label: 'N° 2055', ch: 2, sub: 'Livraison · Bingerville', items: [['3', 'Garba spécial', 'Piment à part']], note: 'Paiement en espèces à la livraison' },
      { label: 'N° 2056', ch: 1, sub: 'Retrait prévu 14h25', items: [['1', 'Gâteau d’anniversaire', 'Inscription : Joyeux anniversaire Awa']], note: '' }
    ];
    return {
      cols: cols,
      addOrder: function () {
        var e = extra[st.seq % extra.length];
        var o = Object.assign({ id: 'x' + st.seq, min: 0, st: 0, isNew: true }, e);
        self.setState({ seq: st.seq + 1, orders: [o].concat(st.orders.map(function (x) { return Object.assign({}, x, { isNew: false }); })) });
      }
    };
  }
}
</script>
</body>
</html>
