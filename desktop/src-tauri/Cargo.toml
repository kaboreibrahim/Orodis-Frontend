[package]
name = "orodis-gestion"
version = "1.0.0"
description = "Espace du personnel des Délices d'Orodis"
authors = ["ibrak Dev"]
edition = "2021"

[lib]
name = "orodis_gestion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
