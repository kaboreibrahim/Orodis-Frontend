<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#241014">
<title>Hors ligne · Les Délices d’Orodis</title>
<!-- Page servie par le service worker quand l'espace du personnel ne répond pas.
     Fichier statique hors de Tailwind : les couleurs reprennent les tokens encre, crème, bordeaux et jaune de globals.css. -->
<style>
  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;background:#241014;color:#FBF5EE;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  main{max-width:360px;display:flex;flex-direction:column;align-items:center;gap:18px}
  img{width:140px;height:auto}
  h1{font-family:Georgia,serif;font-size:28px;margin:0}
  em{color:#EBE320}
  p{margin:0;color:#D9C3C6;line-height:1.5}
  button{min-height:48px;padding:0 28px;border:0;border-radius:999px;background:#810C1B;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/logo-delices-orodis-blanc-web.png" alt="Les Délices d’Orodis">
  <h1>Pas de <em>connexion</em></h1>
  <p>L’espace du personnel a besoin d’Internet pour afficher les commandes en direct. Vérifiez le Wi-Fi ou les données mobiles.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
  <p>La page se recharge seule dès le retour du réseau.</p>
</main>
<script>addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
